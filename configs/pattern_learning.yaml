config_version: "1"
split:
  - train
validation_split:
  - validation
generator_retries: 3
iteration_count: 1
seed: 42
population_size: 12
elite_fraction: 0.25
children_per_elite: 2
crossover_rate: 1.0
patience_factor: 0.10
accept_margin: 0.001
max_repairs: 2
mutate_temperature: 0.7
mutate_max_tokens: 8192
losses:
  - kind: correlation_structure
    weight: 1.0
    histogram_bins: 12
    pair_limit: 500
